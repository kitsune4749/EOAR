<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EOAR · Eastern Ontario Air &amp; Allergy</title>
  <meta name="description" content="Air quality, pollen and mould outlook for Eastern Ontario, from Pembroke to Hawkesbury and Kingston to Cornwall, with a symptom journal and allergy shot log.">
  <meta name="theme-color" content="#065f46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EOAR">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main id="view" class="view" aria-live="polite"></main>

  <nav id="tabs" class="tabs" aria-label="Sections">
    <button data-view="today"><span aria-hidden="true">🌿</span>Today</button>
    <button data-view="forecast"><span aria-hidden="true">📅</span>Forecast</button>
    <button data-view="region"><span aria-hidden="true">🗺️</span>Region</button>
    <button data-view="journal"><span aria-hidden="true">📝</span>Journal</button>
    <button data-view="shots"><span aria-hidden="true">💉</span>Shots</button>
    <button data-view="more"><span aria-hidden="true">⋯</span>More</button>
  </nav>

  <dialog id="infoDialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <noscript><p style="padding:20px">EOAR needs JavaScript turned on.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
